<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Level Up 🎮</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    min-height:100vh;
    background:radial-gradient(circle at 50% 20%, #1a1035, #0a0518 70%);
    font-family:'Inter',sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    overflow:hidden; position:relative; padding:20px; color:#fff;
  }
  .star{ position:absolute; background:white; border-radius:50%; opacity:0.6; animation:twinkle 2s ease infinite; }
  @keyframes twinkle{ 50%{ opacity:0.15; } }

  h1{ font-family:'Press Start 2P', monospace; font-size:clamp(14px,4vw,18px); color:#A78BFA; text-align:center; margin-bottom:8px; z-index:2; text-shadow:0 0 14px rgba(167,139,250,0.6); }
  .sub{ color:#9CA3AF; font-size:12.5px; margin-bottom:30px; text-align:center; z-index:2; }

  .card{
    z-index:2; background:rgba(255,255,255,0.05); border:1px solid rgba(167,139,250,0.3);
    border-radius:16px; padding:28px 26px; max-width:340px; width:90%; text-align:center;
    backdrop-filter:blur(6px); box-shadow:0 0 40px rgba(124,58,237,0.2);
  }
  .avatar{ font-size:52px; margin-bottom:10px; }
  .level-label{ font-family:'Press Start 2P', monospace; font-size:11px; color:#FBBF24; margin-bottom:14px; }

  .xp-track{
    width:100%; height:20px; background:#1F1435; border-radius:10px; overflow:hidden;
    border:1px solid rgba(167,139,250,0.3); margin-bottom:10px; position:relative;
  }
  .xp-fill{
    height:100%; width:0%; border-radius:10px;
    background:linear-gradient(90deg,#7C3AED,#F472B6);
    transition:width .6s cubic-bezier(.34,1.2,.64,1);
    box-shadow:0 0 12px rgba(244,114,182,0.6);
  }
  .xp-text{ font-size:11.5px; color:#C4B5FD; margin-bottom:20px; }

  button{
    font-family:'Press Start 2P', monospace; font-size:10.5px; padding:14px 20px;
    border-radius:10px; border:none; cursor:pointer; color:white;
    background:linear-gradient(135deg,#7C3AED,#DB2777);
    box-shadow:0 6px 20px rgba(124,58,237,0.5); transition:transform .15s ease;
  }
  button:hover{ transform:scale(1.05); }
  button:disabled{ opacity:0.4; cursor:not-allowed; }

  .unlock{
    display:none; margin-top:20px; padding-top:18px; border-top:1px dashed rgba(167,139,250,0.3);
  }
  .unlock.show{ display:block; animation:popIn2 .5s cubic-bezier(.34,1.56,.64,1); }
  @keyframes popIn2{ 0%{opacity:0; transform:scale(0.7);} 100%{opacity:1; transform:scale(1);} }
  .badge{ font-size:15px; color:#FBBF24; font-family:'Press Start 2P', monospace; margin-bottom:10px; }
  .msg{ font-size:13.5px; color:#E5E7EB; line-height:1.6; }

  .flash{
    position:fixed; inset:0; background:white; opacity:0; pointer-events:none; z-index:9;
  }
  .flash.go{ animation:flashPop .4s ease; }
  @keyframes flashPop{ 0%{opacity:0.85;} 100%{opacity:0;} }
</style>
</head>
<body>

<div class="flash" id="flash"></div>

<h1>PLAYER STATUS</h1>
<p class="sub" id="sub">boyfriend.exe — loading affection...</p>

<div class="card">
  <div class="avatar">🎮</div>
  <div class="level-label" id="levelLabel">LEVEL 1: TRYING</div>
  <div class="xp-track"><div class="xp-fill" id="xpFill"></div></div>
  <div class="xp-text" id="xpText">0 / 100 XP</div>

  <button id="xpBtn">Give XP +25</button>

  <div class="unlock" id="unlock">
    <div class="badge">🏆 ACHIEVEMENT UNLOCKED</div>
    <div class="msg" id="unlockMsg"></div>
  </div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const name = params.get('name');
  const message = params.get('message') || "Real talk though — you're the best part of my day, every day. Level: unbeatable. 🏆";
  if(name) document.getElementById('sub').textContent = `${name}.exe — loading affection...`;

  // stars
  for(let i=0;i<40;i++){
    const s = document.createElement('div');
    s.className = 'star';
    const size = 1 + Math.random()*2;
    s.style.width = size+'px'; s.style.height = size+'px';
    s.style.left = Math.random()*100+'%'; s.style.top = Math.random()*100+'%';
    s.style.animationDelay = (Math.random()*2)+'s';
    document.body.appendChild(s);
  }

  const LEVELS = ['TRYING','GETTING THERE','PRETTY SOLID','CRUSHING IT','GOD TIER'];
  let xp = 0;
  const xpFill = document.getElementById('xpFill');
  const xpText = document.getElementById('xpText');
  const levelLabel = document.getElementById('levelLabel');
  const btn = document.getElementById('xpBtn');

  btn.addEventListener('click', ()=>{
    xp = Math.min(100, xp + 25);
    xpFill.style.width = xp + '%';
    xpText.textContent = `${xp} / 100 XP`;
    const levelIdx = Math.min(LEVELS.length-1, Math.floor(xp/25));
    levelLabel.textContent = `LEVEL ${levelIdx+1}: ${LEVELS[levelIdx]}`;

    if(xp >= 100){
      btn.disabled = true;
      btn.textContent = 'MAX LEVEL';
      document.getElementById('flash').classList.add('go');
      document.getElementById('unlockMsg').textContent = message;
      setTimeout(()=>document.getElementById('unlock').classList.add('show'), 200);
    }
  });
</script>

</body>
</html>
