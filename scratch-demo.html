<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scratch & Reveal 🎁</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    min-height:100vh;
    background:linear-gradient(160deg,#FFE8F0,#FFF3E0,#F3E8FF);
    font-family:'Poppins',sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    overflow:hidden; position:relative; padding:20px;
  }
  h1{ font-family:'Baloo 2',sans-serif; color:#D6336C; font-size:clamp(20px,5vw,26px); text-align:center; margin-bottom:6px; z-index:2; }
  .sub{ color:#a15a76; font-size:13.5px; margin-bottom:22px; text-align:center; z-index:2; }

  .scratch-wrap{
    position:relative; width:300px; max-width:90vw; height:180px; border-radius:18px; overflow:hidden;
    box-shadow:0 14px 40px rgba(214,51,108,0.25); z-index:2; background:white;
  }
  .under-message{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    padding:22px; text-align:center; font-family:'Baloo 2',sans-serif; font-size:16px; color:#7A1E3C; line-height:1.4;
  }
  canvas{ position:absolute; inset:0; cursor:grab; touch-action:none; }

  .hint{ z-index:2; font-size:12.5px; color:#D6336C; opacity:0.75; margin-top:14px; }
  .hint.done{ opacity:1; font-weight:600; }

  .heart3{ position:absolute; bottom:-30px; font-size:18px; opacity:0.7; animation:floatUp3 linear infinite; pointer-events:none; }
  @keyframes floatUp3{ 0%{transform:translateY(0);opacity:0;} 10%{opacity:0.7;} 100%{transform:translateY(-100vh);opacity:0;} }
</style>
</head>
<body>

<h1 id="title">Ek gift hai tumhare liye 🎁</h1>
<p class="sub">apni ungli se scratch karo 👆</p>

<div class="scratch-wrap">
  <div class="under-message" id="underMsg"></div>
  <canvas id="scratchCanvas"></canvas>
</div>

<p class="hint" id="hint">scratch karke dekho kya hai andar...</p>

<script>
  const params = new URLSearchParams(window.location.search);
  const name = params.get('name');
  const message = params.get('message') || "Tum meri favorite notification ho. Har roz, bina exception ke. 💌";
  if(name) document.getElementById('title').textContent = `${name} ke liye ek gift 🎁`;
  document.getElementById('underMsg').textContent = message;

  for(let i=0;i<16;i++){
    const h = document.createElement('div');
    h.className = 'heart3';
    h.textContent = ['💗','✨','🎀','💫'][Math.floor(Math.random()*4)];
    h.style.left = Math.random()*100+'%';
    h.style.fontSize = (14+Math.random()*14)+'px';
    h.style.animationDuration = (8+Math.random()*7)+'s';
    h.style.animationDelay = (Math.random()*8)+'s';
    document.body.appendChild(h);
  }

  const canvas = document.getElementById('scratchCanvas');
  const wrap = document.querySelector('.scratch-wrap');
  const ctx = canvas.getContext('2d');

  function sizeCanvas(){
    canvas.width = wrap.offsetWidth;
    canvas.height = wrap.offsetHeight;
    const grad = ctx.createLinearGradient(0,0,canvas.width,canvas.height);
    grad.addColorStop(0,'#F783C4'); grad.addColorStop(1,'#A78BFA');
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.font = '600 15px Poppins, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('✦ scratch here ✦', canvas.width/2, canvas.height/2);
  }
  sizeCanvas();
  window.addEventListener('resize', sizeCanvas);

  let scratching = false;
  let scratchedPixels = 0;
  let checked = false;

  function scratchAt(x,y){
    ctx.globalCompositeOperation = 'destination-out';
    ctx.beginPath();
    ctx.arc(x,y,22,0,Math.PI*2);
    ctx.fill();
  }

  function getPos(e){
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: clientX-rect.left, y: clientY-rect.top };
  }

  function checkDone(){
    if(checked) return;
    const imgData = ctx.getImageData(0,0,canvas.width,canvas.height).data;
    let cleared = 0;
    for(let i=3;i<imgData.length;i+=4*20){ if(imgData[i]===0) cleared++; }
    const total = imgData.length/(4*20);
    if(cleared/total > 0.55){
      checked = true;
      canvas.style.transition = 'opacity .5s ease';
      canvas.style.opacity = '0';
      document.getElementById('hint').textContent = 'mil gaya 🥹';
      document.getElementById('hint').classList.add('done');
    }
  }

  canvas.addEventListener('mousedown', e=>{ scratching = true; const p=getPos(e); scratchAt(p.x,p.y); });
  canvas.addEventListener('mousemove', e=>{ if(scratching){ const p=getPos(e); scratchAt(p.x,p.y); checkDone(); } });
  window.addEventListener('mouseup', ()=> scratching = false);

  canvas.addEventListener('touchstart', e=>{ scratching=true; const p=getPos(e); scratchAt(p.x,p.y); });
  canvas.addEventListener('touchmove', e=>{ e.preventDefault(); const p=getPos(e); scratchAt(p.x,p.y); checkDone(); }, {passive:false});
  canvas.addEventListener('touchend', ()=> scratching=false);
</script>

</body>
</html>
