<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Flower For You 🌸</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    min-height:100vh;
    background:linear-gradient(160deg,#FDEBF3 0%, #F3E8FF 50%, #E8F4FF 100%);
    font-family:'Quicksand',sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    overflow:hidden; position:relative; padding:20px;
  }
  .petal-fall{
    position:absolute; top:-20px; font-size:16px; opacity:0.8;
    animation:petalFall linear infinite; pointer-events:none;
  }
  @keyframes petalFall{
    0%{ transform:translateY(0) rotate(0) translateX(0); opacity:0; }
    10%{ opacity:0.8; }
    100%{ transform:translateY(105vh) rotate(300deg) translateX(30px); opacity:0; }
  }
  h1{ font-family:'Playfair Display',serif; color:#B5389D; font-size:clamp(22px,5vw,28px); text-align:center; margin-bottom:6px; z-index:2; }
  .sub{ color:#9c6ba8; font-size:13.5px; margin-bottom:26px; text-align:center; z-index:2; }

  .garden{ display:flex; gap:14px; z-index:2; margin-bottom:20px; min-height:130px; align-items:flex-end; }
  .flower-slot{ width:44px; height:120px; position:relative; cursor:pointer; }
  .stem{ position:absolute; bottom:0; left:50%; transform:translateX(-50%); width:3px; height:60px; background:#7CB87A; border-radius:2px; }
  .bud{ position:absolute; top:0; left:50%; transform:translateX(-50%) scale(0.4); width:24px; height:24px; transition:transform .5s cubic-bezier(.34,1.56,.64,1); }
  .flower-slot.bloomed .bud{ transform:translateX(-50%) scale(1); }
  .petal{ position:absolute; width:14px; height:20px; background:#F783C4; border-radius:60% 60% 60% 0; top:2px; left:5px; opacity:0; transition:opacity .4s ease; }
  .flower-slot.bloomed .petal{ opacity:1; }
  .p1{ transform:rotate(0deg); } .p2{ transform:rotate(72deg); } .p3{ transform:rotate(144deg); }
  .p4{ transform:rotate(216deg); } .p5{ transform:rotate(288deg); }
  .center-dot{ position:absolute; width:8px; height:8px; background:#FFD34D; border-radius:50%; top:8px; left:8px; opacity:0; transition:opacity .4s ease .3s; }
  .flower-slot.bloomed .center-dot{ opacity:1; }
  .leaf{ position:absolute; bottom:30px; left:-6px; width:14px; height:8px; background:#8FCB8B; border-radius:0 50% 0 50%; transform:rotate(-20deg); }

  .bubble{
    z-index:2; background:white; border-radius:18px; padding:16px 22px; max-width:300px; text-align:center;
    font-size:14.5px; color:#7a3a6a; box-shadow:0 10px 30px rgba(181,56,157,0.15);
    opacity:0; transform:translateY(10px) scale(0.95); transition:all .4s cubic-bezier(.34,1.56,.64,1);
  }
  .bubble.show{ opacity:1; transform:translateY(0) scale(1); }

  .hint{ z-index:2; font-size:12.5px; color:#B5389D; opacity:0.7; margin-top:16px; }
</style>
</head>
<body>

<h1 id="title">A little garden for Riya</h1>
<p class="sub">tap each flower to make it bloom 🌷</p>

<div class="garden" id="garden"></div>
<div class="bubble" id="bubble"></div>
<p class="hint" id="hint">0 / 5 bloomed</p>

<script>
  const params = new URLSearchParams(window.location.search);
  const name = params.get('name');
  const message = params.get('message') || "Just like this garden, my love for you keeps growing a little more every single day. 🌸";
  if(name) document.getElementById('title').textContent = `A little garden for ${name}`;

  for(let i=0;i<20;i++){
    const p = document.createElement('div');
    p.className = 'petal-fall';
    p.textContent = ['🌸','🌷','💮','✨'][Math.floor(Math.random()*4)];
    p.style.left = Math.random()*100+'%';
    p.style.animationDuration = (8+Math.random()*8)+'s';
    p.style.animationDelay = (Math.random()*8)+'s';
    document.body.appendChild(p);
  }

  const garden = document.getElementById('garden');
  const TOTAL = 5;
  let bloomed = 0;
  for(let i=0;i<TOTAL;i++){
    const slot = document.createElement('div');
    slot.className = 'flower-slot';
    slot.innerHTML = `
      <div class="stem"><div class="leaf"></div></div>
      <div class="bud">
        <div class="petal p1"></div><div class="petal p2"></div><div class="petal p3"></div>
        <div class="petal p4"></div><div class="petal p5"></div>
        <div class="center-dot"></div>
      </div>`;
    slot.addEventListener('click', ()=>{
      if(!slot.classList.contains('bloomed')){
        slot.classList.add('bloomed');
        bloomed++;
        document.getElementById('hint').textContent = `${bloomed} / ${TOTAL} bloomed`;
        if(bloomed === TOTAL){
          const bubble = document.getElementById('bubble');
          bubble.textContent = message;
          bubble.classList.add('show');
          document.getElementById('hint').textContent = 'all bloomed 🌸';
        }
      }
    });
    garden.appendChild(slot);
  }
</script>

</body>
</html>
