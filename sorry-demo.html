<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I'm Sorry 🥺</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    min-height:100vh;
    background:linear-gradient(180deg, #6b7c93 0%, #8fa3bb 60%, #b8c6d6 100%);
    transition:background 2s ease;
    font-family:'Quicksand', sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    overflow:hidden;
    position:relative;
    padding:20px;
  }
  body.sunny{
    background:linear-gradient(180deg, #FFE29A 0%, #FFC98A 50%, #FFD9B0 100%);
  }

  .cloud{
    position:absolute;
    background:rgba(255,255,255,0.85);
    border-radius:50px;
    filter:blur(1px);
    transition:opacity 1.5s ease, transform 2s ease;
  }
  .cloud::before, .cloud::after{
    content:''; position:absolute; background:inherit; border-radius:50%;
  }
  .c1{ width:120px; height:40px; top:10%; left:8%; }
  .c1::before{ width:60px; height:60px; top:-30px; left:10px; }
  .c1::after{ width:50px; height:50px; top:-22px; left:60px; }
  .c2{ width:100px; height:34px; top:18%; right:10%; }
  .c2::before{ width:50px; height:50px; top:-24px; left:8px; }
  .c2::after{ width:40px; height:40px; top:-18px; left:50px; }
  .c3{ width:90px; height:30px; top:6%; left:42%; }
  .c3::before{ width:44px; height:44px; top:-20px; left:6px; }
  .c3::after{ width:36px; height:36px; top:-16px; left:44px; }
  body.sunny .cloud{ opacity:0; transform:translateY(-30px); }

  .sun{
    position:absolute; top:8%; left:50%; transform:translateX(-50%) scale(0);
    width:90px; height:90px; border-radius:50%;
    background:radial-gradient(circle, #FFE082, #FFB74D);
    box-shadow:0 0 60px 20px rgba(255,190,90,0.5);
    transition:transform 1.5s cubic-bezier(.34,1.56,.64,1);
  }
  body.sunny .sun{ transform:translateX(-50%) scale(1); }

  .rainbow{
    position:absolute; bottom:-140px; left:50%; transform:translateX(-50%) scale(0.8);
    width:420px; height:420px;
    border-radius:50%;
    background:conic-gradient(from 180deg,
      #ff6b6b 0deg, #ffb86b 30deg, #ffe66d 60deg, #8fd694 90deg,
      #6bc4ff 120deg, #8a7bff 150deg, #ff6b6b 180deg, transparent 181deg, transparent 360deg);
    -webkit-mask:radial-gradient(circle, transparent 60%, black 61%, black 66%, transparent 67%);
    mask:radial-gradient(circle, transparent 60%, black 61%, black 66%, transparent 67%);
    opacity:0;
    transition:opacity 1.5s ease 0.5s, transform 1.5s ease 0.5s;
  }
  body.sunny .rainbow{ opacity:0.85; transform:translateX(-50%) scale(1); }

  .rain{
    position:absolute; top:-20px;
    width:2px; height:16px;
    background:linear-gradient(180deg, transparent, rgba(255,255,255,0.7));
    animation:fall linear infinite;
  }
  @keyframes fall{
    to{ transform:translateY(110vh); }
  }
  body.sunny .rain{ opacity:0; transition:opacity 0.6s ease; }

  .card{
    position:relative; z-index:3;
    background:rgba(255,255,255,0.9);
    backdrop-filter:blur(8px);
    border-radius:24px;
    padding:44px 34px;
    max-width:400px; width:90%;
    text-align:center;
    box-shadow:0 20px 50px rgba(30,40,60,0.25);
  }
  h1{
    font-family:'Playfair Display', serif;
    font-size:clamp(24px,5.5vw,30px);
    color:#4A5568;
    margin-bottom:16px;
    transition:color 1s ease;
  }
  body.sunny h1{ color:#B75D1E; }

  .face{
    font-size:64px;
    margin-bottom:14px;
    display:inline-block;
    transition:transform 0.5s cubic-bezier(.34,1.56,.64,1);
  }

  #typewriter{
    font-size:15px;
    color:#5c677a;
    min-height:44px;
    margin-bottom:22px;
  }
  #typewriter::after{
    content:'|';
    animation:blink 0.8s step-start infinite;
  }
  @keyframes blink{ 50%{opacity:0;} }

  button{
    font-family:'Quicksand', sans-serif;
    font-weight:700;
    font-size:15px;
    padding:13px 30px;
    border-radius:999px;
    border:none;
    cursor:pointer;
    background:linear-gradient(135deg,#6b7c93,#4A5568);
    color:white;
    box-shadow:0 8px 20px rgba(74,85,104,0.35);
    transition:all .2s ease;
  }
  button:hover{ transform:scale(1.06); }
  button.hidden{ display:none; }

  .after-text{
    display:none;
    font-size:14px;
    color:#B75D1E;
    margin-top:4px;
  }
  .after-text.show{ display:block; animation:fadeIn 0.6s ease; }
  @keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }

  .heart-burst{
    position:fixed; font-size:18px; pointer-events:none; z-index:6;
    animation:heartUp 1.6s ease-out forwards;
  }
  @keyframes heartUp{
    0%{ transform:translateY(0) scale(0.6); opacity:1; }
    100%{ transform:translateY(-140px) scale(1.2); opacity:0; }
  }
</style>
</head>
<body>

<div class="cloud c1"></div>
<div class="cloud c2"></div>
<div class="cloud c3"></div>
<div class="sun" id="sun"></div>
<div class="rainbow" id="rainbow"></div>
<div id="rainField"></div>

<div class="card">
  <div class="face" id="face">🥺</div>
  <h1 id="title">I'm sorry, Riya</h1>
  <p id="typewriter"></p>
  <button id="forgiveBtn">Make it sunny again ☀️</button>
  <p class="after-text" id="afterText">Thank you for forgiving me. I promise to do better. 💛</p>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const name = params.get('name') || 'Riya';
  const message = params.get('message') || "I know I messed up, and I'm truly sorry. You mean everything to me, and I never want to make you feel this way again.";

  document.getElementById('title').textContent = `I'm sorry, ${name}`;

  // rain field
  const rainField = document.getElementById('rainField');
  for(let i=0;i<40;i++){
    const drop = document.createElement('div');
    drop.className = 'rain';
    drop.style.left = Math.random()*100 + '%';
    drop.style.animationDuration = (0.6 + Math.random()*0.5) + 's';
    drop.style.animationDelay = (Math.random()*1) + 's';
    rainField.appendChild(drop);
  }

  // typewriter
  const tw = document.getElementById('typewriter');
  let i = 0;
  function typeNext(){
    if(i <= message.length){
      tw.textContent = message.slice(0, i);
      i++;
      setTimeout(typeNext, 26);
    } else {
      tw.style.animation = 'none';
    }
  }
  setTimeout(typeNext, 500);

  // forgive button
  document.getElementById('forgiveBtn').addEventListener('click', (e)=>{
    document.body.classList.add('sunny');
    document.getElementById('face').textContent = '🥰';
    document.getElementById('forgiveBtn').classList.add('hidden');
    document.getElementById('afterText').classList.add('show');

    for(let i=0;i<24;i++){
      const h = document.createElement('div');
      h.className = 'heart-burst';
      h.textContent = ['💛','✨','🌈','💫'][Math.floor(Math.random()*4)];
      h.style.left = (e.clientX + (Math.random()-0.5)*160) + 'px';
      h.style.top = e.clientY + 'px';
      h.style.animationDelay = (Math.random()*0.4) + 's';
      document.body.appendChild(h);
      setTimeout(()=>h.remove(), 2200);
    }
  });
</script>

</body>
</html>
