<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Message.exe</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    min-height:100vh;
    background:#008080;
    background-image:repeating-linear-gradient(45deg, rgba(255,255,255,0.03) 0 2px, transparent 2px 40px);
    font-family:'Inter',sans-serif;
    display:flex; align-items:center; justify-content:center;
    padding:20px; position:relative; overflow:hidden;
  }
  .desktop-icon{
    position:absolute; top:20px; left:20px; text-align:center; color:white; font-size:11px;
    text-shadow:1px 1px 0 #000;
  }
  .desktop-icon .ico{ font-size:34px; }

  .window{
    width:100%; max-width:420px;
    background:#C0C0C0;
    border:2px solid #fff;
    border-right-color:#404040; border-bottom-color:#404040;
    box-shadow:4px 4px 0 rgba(0,0,0,0.4);
    animation:winOpen .3s ease;
  }
  @keyframes winOpen{ from{ opacity:0; transform:scale(0.85); } to{ opacity:1; transform:scale(1); } }

  .titlebar{
    background:linear-gradient(90deg,#000080,#1084d0);
    color:white; padding:5px 8px; display:flex; justify-content:space-between; align-items:center;
    font-size:13px; font-weight:600;
  }
  .titlebar .btns{ display:flex; gap:4px; }
  .titlebar .btns span{
    width:18px; height:16px; background:#C0C0C0; border:1px solid #fff; border-right-color:#404040;
    border-bottom-color:#404040; display:inline-flex; align-items:center; justify-content:center;
    font-size:11px; color:#000; font-weight:700;
  }

  .win-body{ padding:18px; background:#C0C0C0; }
  .msg-box{
    background:white; border:2px inset #808080; padding:16px; min-height:140px;
    font-family:'VT323', monospace; font-size:20px; color:#111; line-height:1.4;
  }
  .msg-box::after{ content:'█'; animation:blink2 0.8s step-start infinite; }
  @keyframes blink2{ 50%{ opacity:0; } }

  .from-line{ font-family:'Inter',sans-serif; font-size:12px; color:#333; margin-bottom:10px; }
  .from-line strong{ color:#000080; }

  .btn-row2{ text-align:right; margin-top:16px; }
  button{
    background:#C0C0C0; border:2px outset #fff; padding:6px 20px; font-size:13px; cursor:pointer;
    font-family:'Inter',sans-serif;
  }
  button:active{ border-style:inset; }

  .after-open{ display:none; margin-top:16px; text-align:center; }
  .after-open.show{ display:block; animation:winOpen .3s ease; }
  .after-open .emoji{ font-size:34px; }
  .after-open p{ font-family:'Inter',sans-serif; font-size:12.5px; color:#333; margin-top:6px; }

  .heart98{ position:fixed; font-size:16px; pointer-events:none; z-index:5; animation:rise98 1.6s ease-out forwards; }
  @keyframes rise98{ to{ transform:translateY(-100px); opacity:0; } }
</style>
</head>
<body>

<div class="desktop-icon"><div class="ico">💌</div>My Documents</div>

<div class="window">
  <div class="titlebar">
    <span>📧 New Message.exe</span>
    <div class="btns"><span>_</span><span>□</span><span>✕</span></div>
  </div>
  <div class="win-body">
    <div class="from-line">From: <strong id="fromName">Someone who loves you</strong> &nbsp;|&nbsp; To: <strong id="toName">You</strong></div>
    <div class="msg-box" id="msgBox"></div>
    <div class="btn-row2"><button id="okBtn">OK</button></div>

    <div class="after-open" id="afterOpen">
      <div class="emoji">💾</div>
      <p>Message.exe has been saved to your heart permanently.</p>
    </div>
  </div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const name = params.get('name');
  const message = params.get('message') || "Hey. Just wanted to say — out of everyone, I still pick you. Every single time. No cap.";
  if(name) document.getElementById('toName').textContent = name;

  const box = document.getElementById('msgBox');
  let i = 0;
  function typeMsg(){
    if(i <= message.length){
      box.textContent = message.slice(0,i);
      i++;
      setTimeout(typeMsg, 24);
    }
  }
  setTimeout(typeMsg, 400);

  document.getElementById('okBtn').addEventListener('click', (e)=>{
    document.getElementById('afterOpen').classList.add('show');
    for(let i=0;i<14;i++){
      const h = document.createElement('div');
      h.className = 'heart98';
      h.textContent = '💗';
      h.style.left = (e.clientX + (Math.random()-0.5)*120) + 'px';
      h.style.top = e.clientY + 'px';
      h.style.animationDelay = (Math.random()*0.3)+'s';
      document.body.appendChild(h);
      setTimeout(()=>h.remove(), 2000);
    }
  });
</script>

</body>
</html>
